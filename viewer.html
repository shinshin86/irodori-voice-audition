<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペルソナ音声 聞き比べ</title>
<style>
  :root{
    --bg:#f5f3ef; --panel:#ffffff; --ink:#242029; --muted:#7a7484; --faint:#a8a2b0;
    --line:#e6e1d9; --accent:#6b4dff; --accent-soft:#efeaff; --ok:#1fa971;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141218;--panel:#1d1b24;--ink:#ece9f2;--muted:#948ea3;--faint:#6b6577;
      --line:#2b2833;--accent:#8f78ff;--accent-soft:#241f36;--ok:#3ec38a;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:24px 20px 60px}
  .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:18px;font-weight:650;letter-spacing:-.01em;margin:0}
  .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .sub a,.banner a{color:var(--accent)}
  .banner{font-size:12.5px;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:8px;padding:7px 11px;margin-bottom:16px}
  .load{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tab{font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  .tab:hover{border-color:var(--accent)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .model{font-size:13.5px;margin:0 0 16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .model b{font-weight:650}
  .model code{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .model.unknown{color:var(--muted)}
  .btn{font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .empty{border:1.5px dashed var(--line);border-radius:14px;padding:40px 26px;text-align:center;color:var(--muted)}
  .empty b{color:var(--ink);font-weight:600;display:block;font-size:16px;margin-bottom:6px}
  .empty code{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:1px 6px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  li{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
    display:grid;grid-template-columns:30px 1fr;gap:6px 14px;align-items:start}
  .n{grid-row:1/3;font-family:var(--mono);font-size:12px;color:var(--faint);text-align:right;
    padding-top:2px;font-variant-numeric:tabular-nums}
  .cap{font-size:15px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
  .cap.none{color:var(--faint);font-style:italic}
  .foot{display:flex;align-items:center;gap:10px;min-width:0}
  audio{height:36px;flex:1;min-width:0}
  .name{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:180px;flex:none}
  .drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 12%,var(--bg));
    display:none;place-items:center;pointer-events:none;z-index:10}
  .drop.show{display:grid}
  .drop div{border:2px dashed var(--accent);border-radius:18px;padding:36px 54px;font-weight:600;
    color:var(--accent);background:var(--panel);font-size:17px}
  @media (max-width:520px){ .name{max-width:96px} .foot{flex-wrap:wrap} }
</style>
</head>
<body>
<div class="drop" id="drop"><div>ここにドロップ</div></div>
<div class="wrap">
  <div class="head">
    <h1>🎧 ペルソナ音声 聞き比べ</h1>
    <span class="count" id="count" hidden></span>
  </div>
  <p class="sub">VoiceDesignで作った声を、キャプションと一緒に並べて聞き比べる（アバターの声探し用 · 複数モデルの比較は <a href="compare.html">compare.html</a>）</p>
  <div class="banner" id="banner" hidden></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="生成モデル" hidden></div>
  <p class="model" id="model" hidden></p>
  <div class="load">
    <button class="btn primary" id="pickFiles">音声を選ぶ</button>
    <button class="btn" id="pickFolder">フォルダを選ぶ</button>
  </div>
  <div class="empty" id="empty">
    <b>outputs/ を自動で探しています…</b>
    ローカルサーバー経由なら <code>outputs/</code> を自動表示します（<code>python3 -m http.server</code> 推奨）。<br>
    直接開いた場合は、音声＋captions.json をこの画面にドロップ、または上のボタンから選択してください
  </div>
  <ul id="list"></ul>
</div>
<input id="fileInput" type="file" multiple accept="audio/*,.json,.txt" hidden>
<input id="folderInput" type="file" webkitdirectory hidden>
<script>
  const $=s=>document.querySelector(s);
  const AUDIO_RE=/\.(wav|mp3|ogg|oga|flac|m4a|aac|webm|opus)$/i;
  const fn=n=>n.replace(/^.*[\/\\]/,'');
  const base=n=>fn(n).replace(/\.[^.]+$/,'');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let items=[];

  function setItems(list){ items=list; render(); }
  function render(){
    const has=items.length>0;
    $('#empty').hidden=has; $('#count').hidden=!has;
    $('#count').textContent=has?`${items.length} 件`:'';
    $('#list').innerHTML=items.map((it,i)=>`
      <li>
        <span class="n">${String(i+1).padStart(2,'0')}</span>
        <div class="cap${it.caption?'':' none'}">${it.caption?esc(it.caption):'(キャプションなし)'}</div>
        <div class="foot">
          <audio controls preload="none" src="${it.url}"></audio>
          <span class="name" title="${esc(it.name)}">${esc(it.name)}</span>
        </div>
      </li>`).join('');
  }

  // --- 生成モデルの表示 ---
  // 複数モデルの出力（models.json）はタブで切り替え、1モデルの出力は generation.json から表示する
  let multi=null;   // {models:[{id,checkpoint,...}], listFor:(model)=>items}
  const parseCaptions=d=>Array.isArray(d)
    ? d.map(o=>({file:fn(o.file||o.name||o.filename||''),caption:o.caption||o.text||''}))
    : Object.entries(d).map(([k,v])=>({file:fn(k),caption:typeof v==='string'?v:(v.caption||'')}));
  const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
  function showModel(info){
    const el=$('#model'); el.hidden=false;
    el.classList.toggle('unknown',!info);
    el.innerHTML=info
      ?`生成モデル: <b>${esc(info.id||info.checkpoint)}</b>${info.checkpoint?`<code>${esc(info.checkpoint)}</code>`:''}`
      :'生成モデル: 記録なし（このフォルダには generation.json / models.json がありません）';
  }
  function selectModel(id,pushUrl){
    const m=multi.models.find(x=>x.id===id)||multi.models[0];
    $('#tabs').querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===m.id));
    showModel(m);
    setItems(multi.listFor(m));
    if(pushUrl){ try{const u=new URL(location.href); u.searchParams.set('model',m.id); history.replaceState(null,'',u);}catch(e){} }
  }
  function startMulti(manifest,urlOf,initial){
    const caps=parseCaptions(manifest.captions||[]);
    const models=(manifest.models||[]).filter(m=>m&&m.id);
    if(!models.length) return false;
    multi={models,listFor:m=>{
      const files=new Set((m.files||caps.map(c=>c.file)).map(fn));
      return caps.filter(c=>c.file&&files.has(c.file)).map(c=>({name:c.file,caption:c.caption,url:urlOf(m,c.file)}))
        .filter(it=>it.url).sort(byName);
    }};
    $('#tabs').hidden=false;
    $('#tabs').innerHTML=models.map(m=>
      `<button class="tab" role="tab" data-id="${esc(m.id)}" title="${esc(m.checkpoint||'')}">${esc(m.id)}</button>`).join('');
    selectModel(initial,false);
    return true;
  }
  $('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t) selectModel(t.dataset.id,true);});
  function resetModel(){ multi=null; $('#tabs').hidden=true; $('#tabs').innerHTML=''; $('#model').hidden=true; }

  // ?dir=outputs-emotions のように読み込むフォルダを選べる（このページからの相対パスのみ）
  function outDir(){
    const d=(new URLSearchParams(location.search).get('dir')||'outputs').replace(/^\/+|\/+$/g,'');
    return d&&/^[\w.\-\/]+$/.test(d)&&!d.split('/').includes('..')?d:'outputs';
  }
  const getJson=async url=>{const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw 0; return r.json();};

  // --- 出力フォルダを自動読み込み（http server 経由のとき） ---
  async function autoload(){
    const dir=outDir(), enc=dir.split('/').map(encodeURIComponent).join('/');
    $('#empty b').textContent=`${dir}/ を自動で探しています…`;
    const banner=t=>{const b=$('#banner'); b.hidden=false; b.textContent=t;};
    try{ // 複数モデルの出力
      const m=await getJson(`${dir}/models.json`);
      const url=(model,file)=>`${enc}/${encodeURIComponent(model.dir||model.id)}/${encodeURIComponent(file)}`;
      if(startMulti(m,url,new URLSearchParams(location.search).get('model'))){
        banner(`${dir}/ から自動読み込み（${m.models.length}モデル。タブで切り替え）`);
        $('#banner').insertAdjacentHTML('beforeend',` · 横並びの比較は <a href="compare.html?dir=${encodeURIComponent(dir)}">compare.html</a>`);
        return;
      }
    }catch(e){}
    try{ // 1モデルの出力
      const list=parseCaptions(await getJson(`${dir}/captions.json`)).filter(o=>o.file)
        .map(o=>({name:o.file,caption:o.caption,url:`${enc}/${encodeURIComponent(o.file)}`})).sort(byName);
      if(!list.length) return;
      let info=null; try{ info=await getJson(`${dir}/generation.json`); }catch(e){}
      // 生成済みファイルの記録があれば、まだ作っていない（失敗した）キャプションは出さない
      const shown=info&&Array.isArray(info.files)?list.filter(it=>info.files.map(fn).includes(it.name)):list;
      banner(`${dir}/ から自動読み込み（${shown.length}件）`);
      showModel(info); setItems(shown);
    }catch(e){ /* サーバー経由でない/未生成 → ドロップ待ち */ }
  }

  // --- 手動読み込み（ドロップ/選択） ---
  async function add(fileList){
    const files=[...fileList];
    const path=f=>f.webkitRelativePath||f.name;
    const readJson=async f=>{try{return JSON.parse(await f.text());}catch(e){return null;}};
    // フォルダ選択で models.json を含むなら複数モデルの出力として開く
    const mf=files.filter(f=>fn(f.name)==='models.json').sort((a,b)=>path(a).length-path(b).length)[0];
    if(mf){
      const m=await readJson(mf); const root=path(mf).slice(0,-'models.json'.length);
      const byPath=new Map(files.map(f=>[path(f),f])), urls=new Map();
      const urlOf=(model,file)=>{
        const k=`${root}${model.dir||model.id}/${file}`;
        if(!byPath.has(k)) return null;
        if(!urls.has(k)) urls.set(k,URL.createObjectURL(byPath.get(k)));  // タブを切り替えても作り直さない
        return urls.get(k);
      };
      if(m&&startMulti(m,urlOf,null)){
        $('#banner').hidden=true; return;
      }
    }
    resetModel();
    const cap={}; let info=null;
    for(const f of files.filter(f=>/\.json$/i.test(f.name))){
      if(fn(f.name)==='generation.json'){ info=await readJson(f); continue; }
      if(fn(f.name)==='models.json') continue;
      const d=await readJson(f);
      if(!d){ alert(`${fn(f.name)} を読めませんでした`); continue; }
      parseCaptions(d).forEach(o=>{ if(o.file) cap[o.file]=o.caption; });
    }
    for(const f of files.filter(f=>/\.txt$/i.test(f.name))) cap[base(f.name)]=(await f.text()).trim();
    const audios=files.filter(f=>AUDIO_RE.test(f.name));
    if(!audios.length){ if(!items.length) alert('音声ファイルが見つかりませんでした'); return; }
    audios.sort((a,b)=>fn(a.name).localeCompare(fn(b.name),undefined,{numeric:true}));
    $('#banner').hidden=true;
    showModel(info);
    setItems(audios.map(f=>({name:fn(f.name),url:URL.createObjectURL(f),caption:cap[fn(f.name)]??cap[base(f.name)]??''})));
  }

  $('#pickFiles').addEventListener('click',()=>$('#fileInput').click());
  $('#pickFolder').addEventListener('click',()=>$('#folderInput').click());
  $('#fileInput').addEventListener('change',e=>{add(e.target.files);e.target.value='';});
  $('#folderInput').addEventListener('change',e=>{add(e.target.files);e.target.value='';});
  let dragN=0;const drop=$('#drop');
  window.addEventListener('dragenter',e=>{e.preventDefault();dragN++;drop.classList.add('show');});
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('dragleave',e=>{e.preventDefault();if(--dragN<=0)drop.classList.remove('show');});
  window.addEventListener('drop',e=>{e.preventDefault();dragN=0;drop.classList.remove('show');
    if(e.dataTransfer.files.length)add(e.dataTransfer.files);});

  autoload();
</script>
</body>
</html>
